name: Bootstrap QuickCart source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project from bundle
        shell: bash
        run: |
          set -e
          if [ -f .quickcart_bootstrapped ]; then
            echo "Already bootstrapped."
            exit 0
          fi

          for f in .quickcart/part-aa.txt .quickcart/part-ab.txt .quickcart/part-ac.txt .quickcart/part-ad.txt; do
            test -s "$f"
          done

          cat .quickcart/part-aa.txt .quickcart/part-ab.txt .quickcart/part-ac.txt .quickcart/part-ad.txt > /tmp/quickcart.b64
          base64 -d /tmp/quickcart.b64 > /tmp/quickcart.zip

          rm -rf /tmp/quickcart_unpack
          mkdir -p /tmp/quickcart_unpack
          unzip -q /tmp/quickcart.zip -d /tmp/quickcart_unpack

          cp -a /tmp/quickcart_unpack/QuickCart_Pro/. .
          rm -rf .quickcart
          touch .quickcart_bootstrapped

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete QuickCart Pro project"
          git push
